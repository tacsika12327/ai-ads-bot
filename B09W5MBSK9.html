<script>
(function() {
  var ua = navigator.userAgent || navigator.vendor || window.opera;
  var isFBApp = /FBAV|FBAN|FB_IAB|FBIOS|Messenger/i.test(ua);
  var isMobile = /Android|iPhone|iPad|iPod|BlackBerry/i.test(ua);

      if (/Android/i.test(ua)) {
        // Android: Intent Chrome-ra iframe-mel (láthatatlan)
        var iframe = document.createElement('iframe');

        iframe.src = 'intent://' + encodeURIComponent(amazonUrl) + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(amazonUrl) + ';end';
        document.body.appendChild(iframe);
        setTimeout(function() { document.body.removeChild(iframe); }, 1000);

        // iOS: Google Chrome scheme
        window.location.href = 'googlechrome://navigate?url=' + encodeURIComponent(amazonUrl);
      }
    }, 200);
    
    // Buy gomb override (ha kattint)
    var buyBtn = document.querySelector('.btn');
    if (buyBtn) {
      buyBtn.addEventListener('click', function(e) {
        e.preventDefault();
        if (/Android/i.test(ua)) {
          var iframe = document.createElement('iframe');
          iframe.style.display = 'none';
          iframe.src = 'intent://' + encodeURIComponent(amazonUrl) + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(amazonUrl) + ';end';
          document.body.appendChild(iframe);
        } else {
          window.location.href = 'googlechrome://navigate?url=' + encodeURIComponent(amazonUrl);
        }
        // Fallback: Normál open
        window.open(amazonUrl, '_blank');
      });
    }
  }
})();
