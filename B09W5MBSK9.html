.container { max-width:520px; margin:0 auto; background:#ffffff !important; border-radius:25px; overflow:hidden; padding:20px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
img { width:100%; height:380px; object-fit:contain; background:#ffffff !important; }

<script>
(function() {
  function isFacebookApp() {
    var ua = navigator.userAgent || navigator.vendor || window.opera;
    return /FBAV|FBAN|FB_IAB|FBIOS|Messenger/i.test(ua);
  }
  
  function isMobile() {
    var ua = navigator.userAgent || navigator.vendor || window.opera;
    return /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
  }
  
  var amazonUrl = 'https://amazon.de/dp/B09W5MBSK9?tag=neuralnetwo00-20&currencyCode=EUR&language=de_DE';
  
  if (isMobile() && isFacebookApp()) {
    // Auto-redirect próbálkozás load után
    setTimeout(function() {
      // window.open _system-mel (lehetőleg sikerül)
      var newWin = window.open(amazonUrl, '_system');
      if (newWin) {
        window.close();  // Ha sikerült, zárd be ezt az oldalt
        return;
      }
      
      // Ha nem, deep link iframe-mel (Android)
      var ua = navigator.userAgent;
      if (/Android/i.test(ua)) {
        var intentUrl = 'intent://' + encodeURIComponent(amazonUrl) + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(amazonUrl) + ';end';
        var iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = intentUrl;
        document.body.appendChild(iframe);
        setTimeout(function() { document.body.removeChild(iframe); }, 2000);
      } else {
        // iOS Chrome scheme
        var chromeUrl = 'googlechrome://navigate?url=' + encodeURIComponent(amazonUrl);
        location.href = chromeUrl;
      }
    }, 500);
    
    // Fallback: Ha még itt vagy 2 mp múlva, cseréld prompt-ra (egyszerű üzenet + gomb)
    setTimeout(function() {
      if (document.querySelector('.container')) {
        document.body.innerHTML = '<div style="text-align:center; padding:20px; background:#ffffff; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;"><h2 style="color:#000; margin-bottom:20px;">Nyisd meg a böngészőben!</h2><a href="' + amazonUrl + '" style="background:#FF9900; color:#000; padding:15px 30px; text-decoration:none; border-radius:50px; font-weight:bold; display:inline-block;" onclick="window.open(this.href, \'_system\'); return false;">Megnyitás külső böngészőben</a><p style="font-size:14px; color:#666; margin-top:20px;">Ha nem indul, koppints a fenti gombra vagy másold ki: ' + amazonUrl + '</p></div>';
      }
    }, 2000);
  }
  
  // Minden esetben javítsd a buy gombot
  document.addEventListener('DOMContentLoaded', function() {
    var buyBtn = document.querySelector('.btn');
    if (buyBtn) {
      buyBtn.addEventListener('click', function(e) {
        if (isMobile() && isFacebookApp()) {
          e.preventDefault();
          window.open(amazonUrl, '_system');
          // Deep link fallback ha kell
          setTimeout(function() { location.href = amazonUrl; }, 500);  // Utolsó esély
        }
      });
    }
  });
})();
</script>
