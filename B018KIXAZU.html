<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Amazon Product</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { margin:0; font-family:Arial; background:#ffffff !important; color:#000000 !important; text-align:center; padding:20px; }
.container { max-width:520px; margin:0 auto; background:#ffffff !important; border-radius:25px; overflow:hidden; padding:20px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
img { width:100%; height:380px; object-fit:contain; background:#ffffff !important; }
h1 { font-size:32px; margin:15px; color:#000000 !important; }
.price { font-size:52px; color:#0f0; font-weight:900; }
.original { font-size:24px; color:#999; text-decoration:line-through; margin:5px 0; }
.blackfriday { font-size:28px; color:#ff0000 !important; font-weight:bold; }
.trust { font-size:14px; color:#666; margin:15px 0; font-weight:500; }
.btn { display:block; background:#FF9900 !important; color:#000000 !important; font-weight:900; font-size:24px; padding:20px; margin:20px auto; border-radius:50px; text-decoration:none; white-space:normal; word-wrap:break-word; overflow-wrap:break-word; hyphens:auto; width:100%; max-width:300px; box-sizing:border-box; }
.footer { font-size:12px; color:#666; margin:30px; }
@media (max-width: 480px) {
    .btn { font-size:20px; padding:15px; margin:15px auto; }
    h1 { font-size:26px; }
    .price { font-size:42px; }
    .blackfriday { font-size:24px; }
    body { padding:10px; }
    .trust img { width:60px; height:15px; }
}
</style>

<script>
(function() {
  var userAgent = navigator.userAgent || navigator.vendor || window.opera;
  var isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(userAgent);
  var isFBApp = /FBAV|FBAN|FB_IAB|FBIOS|Messenger/i.test(userAgent);
  var currentUrl = window.location.href;
  var amazonUrl = 'https://amazon.de/dp/B018KIXAZU?tag=neuralnetwo00-20';  // Az Amazon link
  var redirectBtnText = 'Öffne im Browser';
  var promptText = 'Öffne diese Seite im Browser für die beste Erfahrung!';
  var copyText = 'Link kopieren: ';

  if (isMobile && isFBApp) {
    // Első próbálkozás: window.open a külső böngészőben
    setTimeout(function() {
      try {
        window.open(amazonUrl, '_system');
      } catch (e) {
        console.log('window.open failed, trying deep link...');
      }
      
      // Második: Deep link Android/iOS-ra
      var deepLink;
      var isAndroid = /Android/i.test(userAgent);
      if (isAndroid) {
        deepLink = 'intent://' + encodeURIComponent(amazonUrl) + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(amazonUrl) + ';end';
      } else {
        // iOS: Próbáljuk Chrome-ot, fallback Safari-ra
        deepLink = 'googlechrome://navigate?url=' + encodeURIComponent(amazonUrl);
        // Alternatív iOS deep link (Safari)
        var safariLink = 'x-web-search://?q=' + encodeURIComponent(amazonUrl);
      }
      
      // Próbáld meg a deep link-et
      function tryDeepLink(link) {
        var a = document.createElement('a');
        a.href = link;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        return true;
      }
      
      var deepSuccess = tryDeepLink(deepLink);
      if (!deepSuccess && !isAndroid) {
        tryDeepLink(safariLink);  // iOS Safari fallback
      }
      
      // Ha semmi sem működik, cseréld a body-t prompt-ra (azonnal, ne várj)
      document.body.innerHTML = '<div style="text-align:center; padding:20px; background:#ffffff; min-height:100vh; display:flex; flex-direction:column; justify-content:center;"><h2 style="color:#000;">' + promptText + '</h2><a href="' + amazonUrl + '" id="redirectBtn" style="background:#FF9900; color:#000; padding:15px 30px; text-decoration:none; border-radius:50px; display:inline-block; font-weight:bold; margin:10px 0;" onclick="tryRedirect(); return false;">' + redirectBtnText + '</a><p style="font-size:14px; color:#666; margin:10px 0;">' + copyText + '<span id="urlText">' + currentUrl + '</span></p><button onclick="copyUrl();" style="background:#007BFF; color:#fff; border:none; padding:10px; border-radius:5px; cursor:pointer;">Másold a linket</button></div>';
      
      // Globális függvények a gombon
      window.tryRedirect = function() {
        // Próbáld meg újra a deep link-et kattintásra
        tryDeepLink(deepLink);
        if (!isAndroid) tryDeepLink(safariLink);
        // Fallback: normál open
        window.open(amazonUrl, '_blank');
      };
      
      window.copyUrl = function() {
        var urlText = document.getElementById('urlText').textContent;
        navigator.clipboard.writeText(urlText).then(function() {
          alert('Link másolva!');
        }).catch(function() {
          // Fallback copy
          var textArea = document.createElement('textarea');
          textArea.value = urlText;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          alert('Link másolva!');
        });
      };
      
    }, 300);  // Rövid várakozás a load-ra
  } else {
    // Ha nem FB app, override a buy gombra is jobb open-t
    var buyBtn = document.querySelector('.btn');
    if (buyBtn) {
      buyBtn.addEventListener('click', function(e) {
        e.preventDefault();
        window.open(amazonUrl, '_blank');
      });
    }
  }
})();
</script>

</head>
<body>
<div class="container">
<div style="height:380px; background:#ffffff !important;"></div>
<h1>Amazon Product</h1>

<div class="blackfriday">Black Friday</div>
<div class="price">N/A</div>
<div class="trust"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a9/Amazon_logo.svg/128px-Amazon_logo.svg.png" alt="Amazon" style="width:80px; height:20px; margin:5px; vertical-align:middle;">Versand durch Amazon · Prime möglich · Kostenloser Versand & 30 Tage Rückgabe</div>
<a href="https://amazon.de/dp/B018KIXAZU?tag=neuralnetwo00-20" class="btn" target="_blank" rel="noopener">Zu Amazon weiter</a>
<div class="footer">Preis kann variieren • Affiliate-Werbung</div>
</div>
</body>
</html>
